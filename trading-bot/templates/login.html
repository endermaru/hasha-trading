<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading Bot Login</title>
</head>
<body style="font-family:sans-serif;max-width:420px;margin:40px auto;padding:0 16px;">
  <h2>Trading Bot 로그인</h2>
  {% if error %}
  <p style='color:#b42318;margin-top:0;'>인증 실패: {{ error }}</p>
  {% endif %}
  <form method="post" action="/auth/login">
    <label>PIN</label><br>
    <input name="pin" type="password" autocomplete="off" required style="width:100%;padding:8px;margin:4px 0 12px;" /><br>
    <label>OTP (6자리)</label><br>
    <input name="otp_code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required style="width:100%;padding:8px;margin:4px 0 12px;" /><br>
    <button type="submit" style="padding:10px 16px;">로그인</button>
  </form>
</body>
</html>
